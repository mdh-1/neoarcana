<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Neoarcana">
  <!-- A single card with a star. Crossed cards were tried first and lost:
       at 16px the crossing card disappears and the mark reads as a blob.
       The field is the site's ink (#191714), the same colour as its headings.
       Oxblood was tried for the star and goes muddy at 16px, so the mark is
       two tones only. In a dark tab the whole thing inverts, or a near-black
       square would vanish against the browser chrome. -->
  <style>
    .field { fill: #191714 }
    .card  { fill: #faf8f4 }
    @media (prefers-color-scheme: dark) {
      .field { fill: #faf8f4 }
      .card  { fill: #191714 }
    }
  </style>
  <rect class="field" width="48" height="48" rx="9"/>
  <rect class="card" x="14" y="8" width="20" height="32" rx="3"/>
  <path class="field" d="M24 15.4 L26.4 21.6 L32.6 24 L26.4 26.4 L24 32.6 L21.6 26.4 L15.4 24 L21.6 21.6 Z"/>
</svg>
